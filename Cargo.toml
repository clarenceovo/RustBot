[package]
name = "RustBot"
version = "0.1.0"
edition = "2021"
author = ['Clarence']

[dependencies]
futures-util = "0.3"
tokio-tungstenite = { version = "0.18", features = ["connect", "native-tls"] }
url = "2.3"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
redis = "0.25.4"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4.38"
uuid = { version = "1.3.0", features = ["v4"] }
log = "0.4.22"
crc32fast = "1.4.2"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
